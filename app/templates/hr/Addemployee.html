{% extends "base.html" %}
{% block title %}Add Employee{% endblock %}

{% block content %}
<style>
 
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  }

  body {
    background-color: #f7f9fc;
    color: #333;
  }

  main {
    padding: 40px;
  }

  .form-container {
    background: #fff;
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    padding: 30px 36px;
    border-radius: 10px;
    box-shadow: 0 6px 30px rgba(22, 50, 92, 0.06);
    animation: fadeIn 0.35s ease-in;
  }

  .form-container h2 {
    text-align: center;
    font-size: 1.6rem;
    color: #222;
    margin-bottom: 18px;
    border-bottom: 2px solid #007bff;
    display: inline-block;
    padding-bottom: 6px;
  }

 
  form {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .form-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
  }

  .form-row label {
    flex: 1;
    font-weight: 600;
    text-align: right;
    color: #444;
  }

  .form-row input,
  .form-row select {
    flex: 2;
    padding: 10px;
    font-size: 1rem;
    border: 1px solid #ccd0d7;
    border-radius: 6px;
    transition: border-color .18s ease, box-shadow .18s ease;
  }

  .form-row input:focus,
  .form-row select:focus {
    border-color: #007bff;
    box-shadow: 0 0 6px rgba(0, 123, 255, 0.15);
    outline: none;
  }

  
  .error {
    color: #d8000c;
    font-size: 0.9rem;
    margin-left: 33%;
    margin-top: -10px;
    min-height: 1.05em;
  }

  .input-error {
    border-color: #d8000c !important;
    box-shadow: 0 0 6px rgba(216, 0, 12, 0.12) !important;
  }

  .small-text {
    font-size: 0.9rem;
    color: #777;
    margin-left: 33%;
    margin-top: -10px;
  }

  
  .form-actions {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 6px;
  }

  .btn {
    padding: 10px 20px;
    border-radius: 6px;
    border: none;
    font-size: 1rem;
    cursor: pointer;
    transition: transform .12s ease, background .12s ease;
  }

  .btn-save {
    background-color: #007bff;
    color: white;
  }

  .btn-save:hover {
    background-color: #005fcc;
    transform: translateY(-2px);
  }

  .btn-cancel {
    background-color: #efefef;
    color: #333;
  }

  .btn-cancel:hover {
    background-color: #ddd;
    transform: translateY(-2px);
  }

 
  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(-6px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @media (max-width: 760px) {
    .form-row {
      flex-direction: column;
      align-items: flex-start;
    }

    .form-row label {
      text-align: left;
    }

    .error,
    .small-text {
      margin-left: 0;
      margin-top: 6px;
    }
  }
</style>

<div class="flex min-h-screen">
  <aside class="w-64 bg-white shadow-md flex flex-col fixed top-0 left-0 bottom-0">
    {% include "common/admin_dashboard.html" %}
  </aside>

  <main class="flex-1 ml-64 p-6 bg-gray-50">
     <h1 class="text-2xl font-semibold mb-6">Welcome HR {{ user.firstname }}</h1>

    <div class="form-container">
      <h2>Add Employee</h2>

   
      <form id="employeeForm" method="POST" action="/add_employee" novalidate>
        <input type="hidden" id="edit_id" name="id">

        <div class="form-row">
          <label for="firstname">First Name</label>
          <input type="text" id="firstname" name="firstname" />
        </div>
        <p class="error" id="firstnameError"></p>

        <div class="form-row">
          <label for="lastname">Last Name</label>
          <input type="text" id="lastname" name="lastname" />
        </div>
        <p class="error" id="lastnameError"></p>

        <div class="form-row">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" />
        </div>
        <p class="error" id="usernameError"></p>

        <div class="form-row">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" />
        </div>
        <p class="error" id="emailError"></p>

        <div class="form-row">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" />
        </div>
        
        <p class="error" id="passwordError"></p>

        <div class="form-row">
          <label for="dept">Department</label>
          <select id="dept" name="dept_id">
            <option value="">-- Select Department --</option>
            {% for dept in dept_list %}
            <option value="{{ dept.dept_id }}">{{ dept.dept_name }}</option>
            {% endfor %}
          </select>
        </div>
        <p class="error" id="deptError"></p>

        <div class="form-row">
          <label for="role">Role</label>
          <select id="role" name="role_id">
            <option value="">-- Select Role --</option>
            {% for r in role %}
            <option value="{{ r.id }}" data-dept="{{ r.dept_id }}">{{ r.role_name }}</option>
            {% endfor %}
          </select>
        </div>
        <p class="error" id="roleError"></p>
       
        <div class="form-actions">
          <button type="reset" class="btn btn-cancel">Reset</button>
          <button type="submit" class="btn btn-save">Save Changes</button>
        </div>
      </form>
    </div>
  </main>
</div>

<script>
  
  document.addEventListener('DOMContentLoaded', function () {
    const form = document.getElementById('employeeForm');

   
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();              
      if (validateForm()) form.submit(); 
    });

    
    const liveFields = ['firstname', 'lastname', 'username', 'email', 'password', 'dept', 'role'];
    liveFields.forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      const eventType = el.tagName.toLowerCase() === 'select' ? 'change' : 'input';
      el.addEventListener(eventType, () => clearError(id));
    });
  });
  
document.getElementById('dept').addEventListener('change', function() {
  const selectedDept = this.value;
  const roleSelect = document.getElementById('role');
  const roleOptions = roleSelect.querySelectorAll('option');

 
  roleSelect.value = '';
  roleOptions.forEach(opt => opt.style.display = 'none'); 
  roleOptions[0].style.display = 'block'; 

  if (selectedDept) {
    roleOptions.forEach(opt => {
      if (opt.dataset.dept == selectedDept || opt.value === '') {
        opt.style.display = 'block';
      }
    });
  }
});

  
  function setError(id, message) {
    const err = document.getElementById(id + 'Error');
    const field = document.getElementById(id);
    if (err) err.textContent = message;
    if (field) field.classList.add('input-error');
  }

  
  function clearError(id) {
    const err = document.getElementById(id + 'Error');
    const field = document.getElementById(id);
    if (err) err.textContent = '';
    if (field) field.classList.remove('input-error');
  }

 
  function validateForm() {
    let valid = true;
   
    const firstname = document.getElementById('firstname').value.trim();
    const lastname = document.getElementById('lastname').value.trim();
    const username = document.getElementById('username').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const dept = document.getElementById('dept').value;
    const role = document.getElementById('role').value;

   
    ['firstname', 'lastname', 'username', 'email', 'password', 'dept', 'role'].forEach(clearError);

 
    if (!firstname) { setError('firstname', 'First name is required.'); valid = false; }

   
    if (!username) { setError('username', 'Username is required.'); valid = false; }
    else if (username.length < 3) { setError('username', 'Username must be at least 3 characters.'); valid = false; }

    
    if (!email) {
      setError('email', 'Email is required.'); valid = false;
    } else {
      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailPattern.test(email)) { setError('email', 'Enter a valid email address.'); valid = false; }
    }

   
    if (password && password.length > 0 && password.length < 6) {
      setError('password', 'Password must be at least 6 characters.');
      valid = false;
    }

   
    if (!dept) { setError('dept', 'Please select a department.'); valid = false; }

    
    if (!role) { setError('role', 'Please select a role.'); valid = false; }

   
    if (!valid) {
      const firstErr = document.querySelector('.input-error');
      if (firstErr) firstErr.focus();
    }

    return valid;
  }
</script>
{% endblock %}
