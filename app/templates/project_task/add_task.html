
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create New Task</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <style>
        .error { border: 2px solid red !important; }
        .error-message { color: red; font-size: 0.875em; min-height: 1.2em; display: block; }
    </style>
</head>
<body class="bg-light">


 <div class="container mt-5">

<!-- <div class="container mt-5">
    <div class="card shadow-lg">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0"><i class="fas fa-plus-circle"></i> Create New Task</h3>
        </div> -->
        <div class="container mt-5">

    <div class="card shadow-lg">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0"><i class="fas fa-plus-circle"></i> Create New Task</h3>
        </div>

        <div class="card-body">
            <form method="POST" enctype="multipart/form-data">

                <div class="row">
                  
                    <div class="col-md-6 mb-3">
                        <label for="project_id" class="form-label fw-bold">Project <span class="text-danger">*</span></label>
                        <select id="project_id" name="project_id" class="form-select">
                            <option value="">-- Select Project --</option>
                            {% for project in projects %}
                                <option value="{{ project.id }}">{{ project.project_name }}</option>
                            {% endfor %}
                        </select>
                        <span class="error-message" id="project_error"></span>
                    </div>

      <!-- Task Name -->
      <div class="mt-4">
        <label class="block text-sm font-medium text-gray-600">Task Name <span class="text-red-500">*</span></label>
        <input id="task_name" name="task_name" type="text" placeholder="Enter task name"
          class="mt-1 w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500">
        <p class="text-red-500 text-sm mt-1" id="task_name_error"></p>
      </div>

      <!-- Task Description -->
      <div class="mt-4">
        <label class="block text-sm font-medium text-gray-600">Task Description</label>
        <textarea id="task_description" name="task_description" rows="3"
          class="mt-1 w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500"></textarea>
      </div>

      <!-- Duration, Estimated, Worked -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
        <div>
          <label class="block text-sm font-medium text-gray-600">Duration (days) <span class="text-red-500">*</span></label>
          <input id="task_duration" name="task_duration" type="number" min="0"
            class="mt-1 w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500">
          <p class="text-red-500 text-sm mt-1" id="task_duration_error"></p>
        </div>


                    <div class="col-md-4 mb-3">
                        <label for="estimated_hrs" class="form-label fw-bold">Estimated Hours <span class="text-danger">*</span></label>
                        <input type="number" id="estimated_hrs" name="estimated_hrs" class="form-control" min="0">
                        <span class="error-message" id="estimated_error"></span>

                    </div> 

                    </div>

                    </div> 

                    <!-- Worked Hours -->

                    <div class="col-md-4 mb-3">
                        <label for="worked_hrs" class="form-label fw-bold">Worked Hours</label>
                        <input type="number" id="worked_hrs" name="worked_hrs" class="form-control" min="0" value="0">
                        <span class="error-message" id="worked_error"></span>
                    </div>
                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label for="assigned_to" class="form-label fw-bold">Assign To (Employee) <span class="text-danger">*</span></label>
                        <select id="assigned_to" name="assigned_to" class="form-select">
                            <option value="">-- Select Employee --</option>
                            {% for employee in employees %}
                                <option value="{{ employee.id }}">{{ employee.employee_name }}</option>
                            {% endfor %}
                        </select>
                        <span class="error-message" id="assigned_error"></span>
                    </div>

        <div>
          <label class="block text-sm font-medium text-gray-600">Assigned By (Manager) <span class="text-red-500">*</span></label>
          <select id="assigned_by" name="assigned_by" class="mt-1 w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500">
            <option value="">-- Select Manager --</option>
            {% for employee in employees %}
              <option value="{{ employee.id }}">{{ employee.employee_name }}</option>
            {% endfor %}
          </select>
          <p class="text-red-500 text-sm mt-1" id="assigned_by_error"></p>
        </div>
      </div>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label for="start_date" class="form-label fw-bold">Start Date <span class="text-danger">*</span></label>
                        <input type="date" id="start_date" name="start_date" class="form-control">
                        <span class="error-message" id="start_error"></span>
                    </div>

        <div>
          <label class="block text-sm font-medium text-gray-600">End Date <span class="text-red-500">*</span></label>
          <input id="end_date" name="end_date" type="date"
            class="mt-1 w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500">
          <p class="text-red-500 text-sm mt-1" id="end_date_error"></p>
        </div>
      </div>

      <!-- Comments -->
      <div class="mt-4">
        <label class="block text-sm font-medium text-gray-600">Manager Comments</label>
        <textarea id="comments" name="comments" rows="2"
          class="mt-1 w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500"></textarea>
      </div>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label for="status" class="form-label fw-bold">Status <span class="text-danger">*</span></label>
                        <select id="status" name="status" class="form-select">
                            <option value="">-- Select Status --</option>
                            <option value="PENDING">Pending</option>
                            <option value="COMPLETED">Completed</option>
                        </select>
                        <span class="error-message" id="status_error"></span>
                    </div>


                    <div class="col-md-6 mb-3">
                        <label for="attachment" class="form-label fw-bold">Attachment</label>
                        <input type="file" id="attachment" name="attachment" class="form-control" accept=".pdf,.doc,.docx,.txt,.png,.jpg,.jpeg,.gif">
                    </div>
                </div>


                <div class="d-flex justify-content-between mt-4">
                    <a href="{{ url_for('task_bp.list_tasks') }}" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> Back to Task List
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Create Task
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>

  <!-- Validation Script -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script>
  $(document).ready(function() {
    $("#taskForm").submit(function(e) {
      let valid = true;
      $(".text-red-500").text("");
      $("input, select").removeClass("border-red-500 border-green-500");

      const showError = (id, msg) => {
        $(`#${id}`).addClass("border-red-500").removeClass("border-green-500");
        $(`#${id}_error`).text(msg);
        valid = false;
      };

      // Required validations
      if (!$("#project_id").val()) showError("project_id", "Project is required.");
      if (!$("#task_name").val().trim()) showError("task_name", "Task Name is required.");
      if (!$("#task_duration").val()) showError("task_duration", "Duration is required.");
      if (!$("#estimated_hrs").val()) showError("estimated_hrs", "Estimated Hours is required.");
      if (!$("#assigned_to").val()) showError("assigned_to", "Assign To is required.");
      if (!$("#assigned_by").val()) showError("assigned_by", "Assigned By is required.");
      if (!$("#start_date").val()) showError("start_date", "Start Date is required.");
      if (!$("#end_date").val()) showError("end_date", "End Date is required.");
      if (!$("#status").val()) showError("status", "Status is required.");

      // Date validation
      const start = new Date($("#start_date").val());
      const end = new Date($("#end_date").val());
      if ($("#end_date").val() && end < start) showError("end_date", "End Date cannot be before Start Date.");

      // Hours validation
      const duration = parseFloat($("#task_duration").val()) || 0;
      const est = parseFloat($("#estimated_hrs").val()) || 0;
      const worked = parseFloat($("#worked_hrs").val()) || 0;
      const max = duration * 24;

      if (est < worked) showError("estimated_hrs", "Estimated Hours cannot be less than Worked Hours.");
      if (est > max) showError("estimated_hrs", `Estimated Hours cannot exceed ${max}.`);
      if (worked > max) showError("worked_hrs", `Worked Hours cannot exceed ${max}.`);

      if (!valid) e.preventDefault();
    });
  });
  </script>
</main>
{% endblock %}
