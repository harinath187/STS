<!-- app/templates/project_task/add_task.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create New Task</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50">

<div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside class="w-64 bg-white shadow-md flex flex-col fixed top-0 left-0 bottom-0 overflow-y-auto">
        {% include "common/project_sidebar.html" %}
    </aside>

    <!-- Main Content -->
    <div class="flex-1 ml-64 p-8">
        <div class="container">
            
            <!-- Back to Dashboard Button -->
            <div class="mb-4">
                <a href="{{ url_for('project_dashboard_bp.project_dashboard') }}" class="btn btn-secondary">
                    <i class="fas fa-arrow-left"></i> Back to Dashboard
                </a>
            </div>

            <div class="card shadow-lg">
                <div class="card-header bg-success text-white">
                    <h3 class="mb-0"><i class="fas fa-plus-circle"></i> Create New Task</h3>
                </div>
                <div class="card-body">
                    <form method="POST" enctype="multipart/form-data">
                        
                        <div class="row">
                            <!-- Project Selection -->
                            <div class="col-md-6 mb-3">
                                <label for="project_id" class="form-label fw-bold">Project <span class="text-danger">*</span></label>
                                <select id="project_id" name="project_id" class="form-select" required>
                                    <option value="">-- Select Project --</option>
                                    {% for project in projects %}
                                        <option value="{{ project.id }}">{{ project.project_name }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <!-- Task Name -->
                            <div class="col-md-6 mb-3">
                                <label for="task_name" class="form-label fw-bold">Task Name <span class="text-danger">*</span></label>
                                <input type="text" id="task_name" name="task_name" class="form-control" required>
                            </div>
                        </div>

                        <!-- Task Description -->
                        <div class="mb-3">
                            <label for="task_description" class="form-label fw-bold">Task Description</label>
                            <textarea id="task_description" name="task_description" class="form-control" rows="3"></textarea>
                        </div>

                        <div class="row">
                            <!-- Task Duration -->
                            <div class="col-md-4 mb-3">
                                <label for="task_duration" class="form-label fw-bold">Duration (days)</label>
                                <input type="number" id="task_duration" name="task_duration" class="form-control" min="0">
                            </div>

                            <!-- Estimated Hours -->
                            <div class="col-md-4 mb-3">
                                <label for="estimated_hrs" class="form-label fw-bold">Estimated Hours</label>
                                <input type="number" id="estimated_hrs" name="estimated_hrs" class="form-control" min="0">
                            </div>

                            <!-- Worked Hours -->
                            <div class="col-md-4 mb-3">
                                <label for="worked_hrs" class="form-label fw-bold">Worked Hours</label>
                                <input type="number" id="worked_hrs" name="worked_hrs" class="form-control" min="0" value="0">
                            </div>
                        </div>

                        <div class="row">
                            <!-- Assigned To (Employee) -->
                            <div class="col-md-6 mb-3">
                                <label for="assigned_to" class="form-label fw-bold">Assign To (Employee)</label>
                                <select id="assigned_to" name="assigned_to" class="form-select">
                                    <option value="">-- Select Employee --</option>
                                    {% for employee in employees %}
                                        <option value="{{ employee.id }}">{{ employee.employee_name }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <!-- Assigned By (Manager) -->
                            <div class="col-md-6 mb-3">
                                <label for="assigned_by" class="form-label fw-bold">Assigned By (Manager)</label>
                                <select id="assigned_by" name="assigned_by" class="form-select">
                                    <option value="">-- Select Manager --</option>
                                    {% for employee in employees %}
                                        <option value="{{ employee.id }}">{{ employee.employee_name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <!-- Start Date -->
                            <div class="col-md-6 mb-3">
                                <label for="start_date" class="form-label fw-bold">Start Date</label>
                                <input type="date" id="start_date" name="start_date" class="form-control">
                            </div>

                            <!-- End Date -->
                            <div class="col-md-6 mb-3">
                                <label for="end_date" class="form-label fw-bold">End Date</label>
                                <input type="date" id="end_date" name="end_date" class="form-control">
                            </div>
                        </div>

                        <!-- Comments -->
                        <div class="mb-3">
                            <label for="comments" class="form-label fw-bold">Manager Comments</label>
                            <textarea id="comments" name="comments" class="form-control" rows="2"></textarea>
                        </div>

                        <div class="row">
                            <!-- Status -->
                            <div class="col-md-6 mb-3">
                                <label for="status" class="form-label fw-bold">Status</label>
                                <select id="status" name="status" class="form-select">
                                    <option value="PENDING">Pending</option>
                                    <option value="COMPLETED">Completed</option>
                                </select>
                            </div>

                            <!-- Attachment -->
                            <div class="col-md-6 mb-3">
                                <label for="attachment" class="form-label fw-bold">Attachment</label>
                                <input type="file" id="attachment" name="attachment" class="form-control" accept=".pdf,.doc,.docx,.txt,.png,.jpg,.jpeg,.gif">
                                <small class="text-muted">Allowed: PDF, DOC, DOCX, TXT, Images</small>
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="d-flex justify-content-between mt-4">
                            <a href="{{ url_for('task_bp.list_tasks') }}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left"></i> Back to Task List
                            </a>
                            <button type="submit" class="btn btn-success">
                                <i class="fas fa-save"></i> Create Task
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
