
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create New Task</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <style>
        .error { border: 2px solid red !important; }
        .error-message { color: red; font-size: 0.875em; min-height: 1.2em; display: block; }
    </style>
</head>
<body class="bg-light">

 <div class="container mt-5">
    <div class="card shadow-lg">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0"><i class="fas fa-plus-circle"></i> Create New Task</h3>
        </div>

        <div class="card-body">
            <form method="POST" enctype="multipart/form-data">

                <div class="row">
                  
                    <div class="col-md-6 mb-3">
                        <label for="project_id" class="form-label fw-bold">Project <span class="text-danger">*</span></label>
                        <select id="project_id" name="project_id" class="form-select">
                            <option value="">-- Select Project --</option>
                            {% for project in projects %}
                                <option value="{{ project.id }}">{{ project.project_name }}</option>
                            {% endfor %}
                        </select>
                        <span class="error-message" id="project_error"></span>
                    </div>

                  
                    <div class="col-md-6 mb-3">
                        <label for="task_name" class="form-label fw-bold">Task Name <span class="text-danger">*</span></label>
                        <input type="text" id="task_name" name="task_name" class="form-control">
                        <span class="error-message" id="name_error"></span>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="task_description" class="form-label fw-bold">Task Description</label>
                    <textarea id="task_description" name="task_description" class="form-control" rows="3"></textarea>
                </div>

                <div class="row">
                
                    <div class="col-md-4 mb-3">
                        <label for="task_duration" class="form-label fw-bold">Duration (days) <span class="text-danger">*</span></label>
                        <input type="number" id="task_duration" name="task_duration" class="form-control" min="0">
                        <span class="error-message" id="duration_error"></span>
                    </div>

                 
                    <div class="col-md-4 mb-3">
                        <label for="estimated_hrs" class="form-label fw-bold">Estimated Hours <span class="text-danger">*</span></label>
                        <input type="number" id="estimated_hrs" name="estimated_hrs" class="form-control" min="0">
                        <span class="error-message" id="estimated_error"></span>
                    </div> -->

                    <!-- Worked Hours -->
                    <div class="col-md-4 mb-3">
                        <label for="worked_hrs" class="form-label fw-bold">Worked Hours</label>
                        <input type="number" id="worked_hrs" name="worked_hrs" class="form-control" min="0" value="0">
                        <span class="error-message" id="worked_error"></span>
                    </div>
                </div>

                <div class="row">
                    
                    <div class="col-md-6 mb-3">
                        <label for="assigned_to" class="form-label fw-bold">Assign To (Employee) <span class="text-danger">*</span></label>
                        <select id="assigned_to" name="assigned_to" class="form-select">
                            <option value="">-- Select Employee --</option>
                            {% for employee in employees %}
                                <option value="{{ employee.id }}">{{ employee.employee_name }}</option>
                            {% endfor %}
                        </select>
                        <span class="error-message" id="assigned_error"></span>
                    </div>

                   
                    <div class="col-md-6 mb-3">
                        <label for="assigned_by" class="form-label fw-bold">Assigned By (Manager) <span class="text-danger">*</span></label>
                        <select id="assigned_by" name="assigned_by" class="form-select">
                            <option value="">-- Select Manager --</option>
                            {% for employee in employees %}
                                <option value="{{ employee.id }}">{{ employee.employee_name }}</option>
                            {% endfor %}
                        </select>
                        <span class="error-message" id="manager_error"></span>
                    </div>
                </div>

                <div class="row">
                  
                    <div class="col-md-6 mb-3">
                        <label for="start_date" class="form-label fw-bold">Start Date <span class="text-danger">*</span></label>
                        <input type="date" id="start_date" name="start_date" class="form-control">
                        <span class="error-message" id="start_error"></span>
                    </div>

                  
                    <div class="col-md-6 mb-3">
                        <label for="end_date" class="form-label fw-bold">End Date <span class="text-danger">*</span></label>
                        <input type="date" id="end_date" name="end_date" class="form-control">
                        <span class="error-message" id="end_error"></span>
                    </div>
                </div>

              
                <div class="mb-3">
                    <label for="comments" class="form-label fw-bold">Manager Comments</label>
                    <textarea id="comments" name="comments" class="form-control" rows="2"></textarea>
                </div>

                <div class="row">
               
                    <div class="col-md-6 mb-3">
                        <label for="status" class="form-label fw-bold">Status <span class="text-danger">*</span></label>
                        <select id="status" name="status" class="form-select">
                            <option value="">-- Select Status --</option>
                            <option value="PENDING">Pending</option>
                            <option value="COMPLETED">Completed</option>
                        </select>
                        <span class="error-message" id="status_error"></span>
                    </div>

                  
                    <div class="col-md-6 mb-3">
                        <label for="attachment" class="form-label fw-bold">Attachment</label>
                        <input type="file" id="attachment" name="attachment" class="form-control" accept=".pdf,.doc,.docx,.txt,.png,.jpg,.jpeg,.gif">
                    </div>
                </div>

                
                <div class="d-flex justify-content-between mt-4">
                    <a href="{{ url_for('task_bp.list_tasks') }}" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> Back to Task List
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Create Task
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
$(document).ready(function() {
    $("form").submit(function(e) {
        let isValid = true;

        $(".error-message").text("");
        $("input, select, textarea").removeClass("error");

      
        if ($("#project_id").val() === "") {
            $("#project_id").addClass("error");
            $("#project_error").text("Project is required.");
            isValid = false;
        }
        if ($("#task_name").val().trim() === "") {
            $("#task_name").addClass("error");
            $("#name_error").text("Task Name is required.");
            isValid = false;
        }
        if ($("#task_duration").val() === "") {
            $("#task_duration").addClass("error");
            $("#duration_error").text("Duration is required.");
            isValid = false;
        }
        if ($("#estimated_hrs").val() === "") {
            $("#estimated_hrs").addClass("error");
            $("#estimated_error").text("Estimated Hours is required.");
            isValid = false;
        }
        if ($("#assigned_to").val() === "") {
            $("#assigned_to").addClass("error");
            $("#assigned_error").text("Assign To is required.");
            isValid = false;
        }
        if ($("#assigned_by").val() === "") {
            $("#assigned_by").addClass("error");
            $("#manager_error").text("Assigned By is required.");
            isValid = false;
        }
        if ($("#start_date").val() === "") {
            $("#start_date").addClass("error");
            $("#start_error").text("Start Date is required.");
            isValid = false;
        }
        if ($("#end_date").val() === "") {
            $("#end_date").addClass("error");
            $("#end_error").text("End Date is required.");
            isValid = false;
        }
        if ($("#status").val() === "") {
            $("#status").addClass("error");
            $("#status_error").text("Status is required.");
            isValid = false;
        }

        // Date validation
        const startDate = new Date($("#start_date").val());
        const endDate = new Date($("#end_date").val());
        if ($("#end_date").val() && endDate < startDate) {
            $("#end_date").addClass("error");
            $("#end_error").text("End Date cannot be before Start Date.");
            isValid = false;
        }

        // Estimated vs Worked Hours validation
        const estimatedHrs = parseFloat($("#estimated_hrs").val()) || 0;
        const workedHrs = parseFloat($("#worked_hrs").val()) || 0;
        const durationDays = parseFloat($("#task_duration").val()) || 0;
        const maxPossibleHrs = durationDays * 24;

        if (estimatedHrs < workedHrs) {
            $("#estimated_hrs, #worked_hrs").addClass("error");
            $("#estimated_error").text("Estimated Hours cannot be less than Worked Hours.");
            $("#worked_error").text("Worked Hours cannot exceed Estimated Hours.");
            isValid = false;
        }
        if (estimatedHrs > maxPossibleHrs) {
            $("#estimated_hrs").addClass("error");
            $("#estimated_error").text(`Estimated Hours cannot exceed total hours (${maxPossibleHrs}).`);
            isValid = false;
        }
        if (workedHrs > maxPossibleHrs) {
            $("#worked_hrs").addClass("error");
            $("#worked_error").text(`Worked Hours cannot exceed total hours (${maxPossibleHrs}).`);
            isValid = false;
        }

        if (!isValid) e.preventDefault(); // Stop form submission
    });
});
</script>

</body>
</html>
