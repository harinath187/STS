{% extends "base.html" %}
{% block title %}Create New Task{% endblock %}

{% block content %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@3.3.3/dist/tailwind.min.css">

<!-- Sidebar -->
<aside class="w-64 bg-white shadow-md flex flex-col fixed top-0 left-0 bottom-0">
  {% include "common/project_manager.html" %}
</aside>

<!-- Main Content -->
<main class="flex-1 ml-64 p-10">
  <div class="bg-white shadow-lg rounded-2xl w-full max-w-3xl p-8 mx-auto">
    <h2 class="text-2xl font-bold mb-6 text-gray-700">
      Create New Task
    </h2>

    <form method="POST" enctype="multipart/form-data" id="taskForm" novalidate>
      <!-- Project -->
      <div>
        <label class="block text-sm font-medium text-gray-600">Project <span class="text-red-500">*</span></label>
        <select id="project_id" name="project_id" class="mt-1 w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500">
          <option value="">-- Select Project --</option>
          {% for project in projects %}
            <option value="{{ project.id }}">{{ project.project_name }}</option>
          {% endfor %}
        </select>
        <p class="text-red-500 text-sm mt-1" id="project_id_error"></p>
      </div>

      <!-- Task Name -->
      <div class="mt-4">
        <label class="block text-sm font-medium text-gray-600">Task Name <span class="text-red-500">*</span></label>
        <input id="task_name" name="task_name" type="text" placeholder="Enter task name"
          class="mt-1 w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500">
        <p class="text-red-500 text-sm mt-1" id="task_name_error"></p>
      </div>

      <!-- Task Description -->
      <div class="mt-4">
        <label class="block text-sm font-medium text-gray-600">Task Description</label>
        <textarea id="task_description" name="task_description" rows="3"
          class="mt-1 w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500"></textarea>
      </div>

      <!-- Duration, Estimated, Worked -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
        <div>
          <label class="block text-sm font-medium text-gray-600">Duration (days) <span class="text-red-500">*</span></label>
          <input id="task_duration" name="task_duration" type="number" min="0"
            class="mt-1 w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500">
          <p class="text-red-500 text-sm mt-1" id="task_duration_error"></p>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-600">Estimated Hours <span class="text-red-500">*</span></label>
          <input id="estimated_hrs" name="estimated_hrs" type="number" min="0"
            class="mt-1 w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500">
          <p class="text-red-500 text-sm mt-1" id="estimated_hrs_error"></p>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-600">Worked Hours</label>
          <input id="worked_hrs" name="worked_hrs" type="number" min="0" value="0"
            class="mt-1 w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500">
          <p class="text-red-500 text-sm mt-1" id="worked_hrs_error"></p>
        </div>
      </div>

      <!-- Assign To / Assigned By -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
        <div>
          <label class="block text-sm font-medium text-gray-600">Assign To (Employee) <span class="text-red-500">*</span></label>
          <select id="assigned_to" name="assigned_to" class="mt-1 w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500">
            <option value="">-- Select Employee --</option>
            {% for employee in employees %}
              <option value="{{ employee.id }}">{{ employee.employee_name }}</option>
            {% endfor %}
          </select>
          <p class="text-red-500 text-sm mt-1" id="assigned_to_error"></p>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-600">Assigned By (Manager) <span class="text-red-500">*</span></label>
          <select id="assigned_by" name="assigned_by" class="mt-1 w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500">
            <option value="">-- Select Manager --</option>
            {% for employee in employees %}
              <option value="{{ employee.id }}">{{ employee.employee_name }}</option>
            {% endfor %}
          </select>
          <p class="text-red-500 text-sm mt-1" id="assigned_by_error"></p>
        </div>
      </div>

      <!-- Dates -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
        <div>
          <label class="block text-sm font-medium text-gray-600">Start Date <span class="text-red-500">*</span></label>
          <input id="start_date" name="start_date" type="date"
            class="mt-1 w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500">
          <p class="text-red-500 text-sm mt-1" id="start_date_error"></p>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-600">End Date <span class="text-red-500">*</span></label>
          <input id="end_date" name="end_date" type="date"
            class="mt-1 w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500">
          <p class="text-red-500 text-sm mt-1" id="end_date_error"></p>
        </div>
      </div>

      <!-- Comments -->
      <div class="mt-4">
        <label class="block text-sm font-medium text-gray-600">Manager Comments</label>
        <textarea id="comments" name="comments" rows="2"
          class="mt-1 w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500"></textarea>
      </div>

      <!-- Status and Attachment -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
        <div>
          <label class="block text-sm font-medium text-gray-600">Status <span class="text-red-500">*</span></label>
          <select id="status" name="status" class="mt-1 w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500">
            <option value="">-- Select Status --</option>
            <option value="PENDING">Pending</option>
            <option value="COMPLETED">Completed</option>
          </select>
          <p class="text-red-500 text-sm mt-1" id="status_error"></p>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-600">Attachment</label>
          <input id="attachment" name="attachment" type="file"
            class="mt-1 w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500"
            accept=".pdf,.doc,.docx,.txt,.png,.jpg,.jpeg,.gif">
        </div>
      </div>

      <!-- Buttons -->
      <div class="flex justify-between items-center mt-6">
        <a href="{{ url_for('task_bp.list_tasks') }}"
          class="bg-blue-600 text-white py-2 px-4 rounded-lg shadow hover:bg-blue-700 transition">
          <i class="fas fa-arrow-left"></i> Back to Task List
        </a>
        <button type="submit"
          class="bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded-xl flex items-center gap-2">
          <i class="fas fa-save"></i> Create Task
        </button>
      </div>
    </form>
  </div>

  <!-- Validation Script -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script>
  $(document).ready(function() {
    $("#taskForm").submit(function(e) {
      let valid = true;
      $(".text-red-500").text("");
      $("input, select").removeClass("border-red-500 border-green-500");

      const showError = (id, msg) => {
        $(`#${id}`).addClass("border-red-500").removeClass("border-green-500");
        $(`#${id}_error`).text(msg);
        valid = false;
      };

      // Required validations
      if (!$("#project_id").val()) showError("project_id", "Project is required.");
      if (!$("#task_name").val().trim()) showError("task_name", "Task Name is required.");
      if (!$("#task_duration").val()) showError("task_duration", "Duration is required.");
      if (!$("#estimated_hrs").val()) showError("estimated_hrs", "Estimated Hours is required.");
      if (!$("#assigned_to").val()) showError("assigned_to", "Assign To is required.");
      if (!$("#assigned_by").val()) showError("assigned_by", "Assigned By is required.");
      if (!$("#start_date").val()) showError("start_date", "Start Date is required.");
      if (!$("#end_date").val()) showError("end_date", "End Date is required.");
      if (!$("#status").val()) showError("status", "Status is required.");

      // Date validation
      const start = new Date($("#start_date").val());
      const end = new Date($("#end_date").val());
      if ($("#end_date").val() && end < start) showError("end_date", "End Date cannot be before Start Date.");

      // Hours validation
      const duration = parseFloat($("#task_duration").val()) || 0;
      const est = parseFloat($("#estimated_hrs").val()) || 0;
      const worked = parseFloat($("#worked_hrs").val()) || 0;
      const max = duration * 24;

      if (est < worked) showError("estimated_hrs", "Estimated Hours cannot be less than Worked Hours.");
      if (est > max) showError("estimated_hrs", `Estimated Hours cannot exceed ${max}.`);
      if (worked > max) showError("worked_hrs", `Worked Hours cannot exceed ${max}.`);

      if (!valid) e.preventDefault();
    });
  });
  </script>
</main>
{% endblock %}
