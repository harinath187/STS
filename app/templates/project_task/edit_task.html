<!-- templates/project_task/edit_task.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Task</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow-lg">
        <div class="card-header bg-warning text-dark">
            <h3 class="mb-0"><i class="fas fa-edit"></i> Edit Task</h3>
        </div>
        <div class="card-body">
            <form method="POST" enctype="multipart/form-data">
                
                <div class="row">
                    <!-- Project Selection (Disabled) -->
                    <div class="col-md-6 mb-3">
                        <label for="project_id" class="form-label fw-bold">Project <span class="text-danger">*</span></label>
                        <select id="project_id" class="form-select" disabled>
                            {% for project in projects %}
                                <option value="{{ project.id }}" {% if project.id == task.project_id %}selected{% endif %}>
                                    {{ project.project_name }}
                                </option>
                            {% endfor %}
                        </select>
                        <!-- Hidden input to submit project_id -->
                        <input type="hidden" name="project_id" value="{{ task.project_id }}">
                    </div>

                    <!-- Task Name -->
                    <div class="col-md-6 mb-3">
                        <label for="task_name" class="form-label fw-bold">Task Name <span class="text-danger">*</span></label>
                        <input type="text" id="task_name" name="task_name" class="form-control" value="{{ task.task_name }}" required>
                    </div>
                </div>

                <!-- Task Description -->
                <div class="mb-3">
                    <label for="task_description" class="form-label fw-bold">Task Description</label>
                    <textarea id="task_description" name="task_description" class="form-control" rows="3">{{ task.task_description or '' }}</textarea>
                </div>

                <div class="row">
                    <!-- Task Duration -->
                    <div class="col-md-4 mb-3">
                        <label for="task_duration" class="form-label fw-bold">Duration (days)</label>
                        <input type="number" id="task_duration" name="task_duration" class="form-control" min="0" value="{{ task.task_Duration or '' }}">
                    </div>

                    <!-- Estimated Hours -->
                    <div class="col-md-4 mb-3">
                        <label for="estimated_hrs" class="form-label fw-bold">Estimated Hours</label>
                        <input type="number" id="estimated_hrs" name="estimated_hrs" class="form-control" min="0" value="{{ task.estimated_hrs or '' }}">
                    </div>

                    <!-- Worked Hours -->
                    <div class="col-md-4 mb-3">
                        <label for="worked_hrs" class="form-label fw-bold">Worked Hours</label>
                        <input type="number" id="worked_hrs" name="worked_hrs" class="form-control" min="0" value="{{ task.worked_hrs or 0 }}">
                    </div>
                </div>

                <div class="row">
                    <!-- Assigned To (Employee) -->
                    <div class="col-md-6 mb-3">
                        <label for="assigned_to" class="form-label fw-bold">Assign To (Employee)</label>
                        <select id="assigned_to" name="assigned_to" class="form-select">
                            <option value="">-- Select Employee --</option>
                            {% for employee in employees %}
                                <option value="{{ employee.id }}" {% if employee.id == task.assigned_to %}selected{% endif %}>
                                    {{ employee.employee_name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Assigned By (Manager, Disabled) -->
                    <div class="col-md-6 mb-3">
                        <label for="assigned_by" class="form-label fw-bold">Assigned By (Manager)</label>
                        <select id="assigned_by" class="form-select" disabled>
                            {% for employee in employees %}
                                <option value="{{ employee.id }}" {% if employee.id == task.assigned_by %}selected{% endif %}>
                                    {{ employee.employee_name }}
                                </option>
                            {% endfor %}
                        </select>
                        <!-- Hidden input to submit assigned_by -->
                        <input type="hidden" name="assigned_by" value="{{ task.assigned_by }}">
                    </div>
                </div>

                <div class="row">
                    <!-- Start Date -->
                    <div class="col-md-6 mb-3">
                        <label for="start_date" class="form-label fw-bold">Start Date</label>
                        <input type="date" id="start_date" name="start_date" class="form-control" value="{{ task.Start_Date or '' }}">
                    </div>

                    <!-- End Date -->
                    <div class="col-md-6 mb-3">
                        <label for="end_date" class="form-label fw-bold">End Date</label>
                        <input type="date" id="end_date" name="end_date" class="form-control" value="{{ task.End_Date or '' }}">
                    </div>
                </div>

                <!-- Comments -->
                <div class="mb-3">
                    <label for="comments" class="form-label fw-bold">Manager Comments</label>
                    <textarea id="comments" name="comments" class="form-control" rows="2">{{ task.Comments or '' }}</textarea>
                </div>

                <div class="row">
                    <!-- Status -->
                    <div class="col-md-6 mb-3">
                        <label for="status" class="form-label fw-bold">Status</label>
                        <select id="status" name="status" class="form-select">
                            <option value="PENDING" {% if task.status == 'PENDING' %}selected{% endif %}>Pending</option>
                            <option value="COMPLETED" {% if task.status == 'COMPLETED' %}selected{% endif %}>Completed</option>
                        </select>
                    </div>

                    <!-- Attachment -->
                    <div class="col-md-6 mb-3">
                        <label for="attachment" class="form-label fw-bold">Attachment</label>
                        <input type="file" id="attachment" name="attachment" class="form-control" accept=".pdf,.doc,.docx,.txt,.png,.jpg,.jpeg,.gif">
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="d-flex justify-content-between mt-4">
                    <a href="{{ url_for('task_bp.list_tasks', project_id=task.project_id) }}" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> Back to Task List
                    </a>
                    <button type="submit" class="btn btn-warning text-dark">
                        <i class="fas fa-save"></i> Update Task
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function() {
    const form = document.querySelector("form");
    const startDateInput = document.getElementById("start_date");
    const endDateInput = document.getElementById("end_date");
    const estimatedHrsInput = document.getElementById("estimated_hrs");
    const workedHrsInput = document.getElementById("worked_hrs");
    const durationInput = document.getElementById("task_duration");

    form.addEventListener("submit", function(e) {
        // Date validation
        const startDate = new Date(startDateInput.value);
        const endDate = new Date(endDateInput.value);
        if (endDateInput.value && endDate < startDate) {
            e.preventDefault();
            alert("End Date cannot be before Start Date!");
            endDateInput.focus();
            return;
        }

        // Estimated vs Worked Hours validation
        const estimatedHrs = parseFloat(estimatedHrsInput.value) || 0;
        const workedHrs = parseFloat(workedHrsInput.value) || 0;
        if (estimatedHrs < workedHrs) {
            e.preventDefault();
            alert("Estimated Hours cannot be less than Worked Hours!");
            estimatedHrsInput.focus();
            return;
        }

        // Duration vs Hours validation
        const durationDays = parseFloat(durationInput.value) || 0;
        const maxPossibleHrs = durationDays * 24; // Assuming 24 hours per day
        if (estimatedHrs > maxPossibleHrs) {
            e.preventDefault();
            alert(`Estimated Hours cannot exceed total hours in task duration (${maxPossibleHrs} hrs for ${durationDays} days)!`);
            estimatedHrsInput.focus();
            return;
        }
        if (workedHrs > maxPossibleHrs) {
            e.preventDefault();
            alert(`Worked Hours cannot exceed total hours in task duration (${maxPossibleHrs} hrs for ${durationDays} days)!`);
            workedHrsInput.focus();
            return;
        }
    });
});
</script>

</body>
</html>
