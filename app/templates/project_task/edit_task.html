        .error-message { color: red; font-size: 0.875em; min-height: 1.2em; display: block; }

</head>

        <div class="container mt-5">
    <div class="card shadow-lg">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0"><i class="fas fa-edit"></i> Edit Task</h3>
        </div>

        <div class="card-body">
            <form method="POST" enctype="multipart/form-data">
                
                <div class="row">
                   
                    <div class="col-md-6 mb-3">
                        <label for="project_id" class="form-label fw-bold">Project <span class="text-danger">*</span></label>
                        <select id="project_id" class="form-select" disabled>
                            {% for project in projects %}
                                <option value="{{ project.id }}" {% if project.id == task.project_id %}selected{% endif %}>
                                    {{ project.project_name }}
                                </option>
                            {% endfor %}
                        </select>
                        <input type="hidden" name="project_id" value="{{ task.project_id }}">
                        <span class="error-message" id="project_error"></span>
                    </div>

      <!-- Task Name -->
      <div>
        <label class="block text-sm font-medium text-gray-600">Task Name <span class="text-red-500">*</span></label>
        <input id="task_name" name="task_name" type="text" value="{{ task.task_name }}"
          class="mt-1 w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500">
        <p class="text-red-500 text-sm mt-1" id="task_name_error"></p>
      </div>

      <!-- Task Description -->
      <div>
        <label class="block text-sm font-medium text-gray-600">Task Description</label>
        <textarea id="task_description" name="task_description" rows="3"
          class="mt-1 w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500">{{ task.task_description or '' }}</textarea>
      </div>

      <!-- Duration / Estimated / Worked Hours -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
        <div>
          <label class="block text-sm font-medium text-gray-600">Duration (days) <span class="text-red-500">*</span></label>
          <input id="task_duration" name="task_duration" type="number" min="0" value="{{ task.task_Duration or '' }}"
            class="mt-1 w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500">
          <p class="text-red-500 text-sm mt-1" id="task_duration_error"></p>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-600">Estimated Hours <span class="text-red-500">*</span></label>
          <input id="estimated_hrs" name="estimated_hrs" type="number" min="0" value="{{ task.estimated_hrs or '' }}"
            class="mt-1 w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500">
          <p class="text-red-500 text-sm mt-1" id="estimated_hrs_error"></p>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-600">Worked Hours</label>
          <input id="worked_hrs" name="worked_hrs" type="number" min="0" value="{{ task.worked_hrs or 0 }}"
            class="mt-1 w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500">
          <p class="text-red-500 text-sm mt-1" id="worked_hrs_error"></p>
        </div>
      </div>

      <!-- Assigned To / By -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div>
          <label class="block text-sm font-medium text-gray-600">Assign To (Employee) <span class="text-red-500">*</span></label>
          <select id="assigned_to" name="assigned_to"
            class="mt-1 w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500">
            <option value="">-- Select Employee --</option>
            {% for employee in employees %}
              <option value="{{ employee.id }}" {% if employee.id == task.assigned_to %}selected{% endif %}>
                {{ employee.employee_name }}
              </option>
            {% endfor %}
          </select>
          <p class="text-red-500 text-sm mt-1" id="assigned_to_error"></p>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-600">Assigned By (Manager)</label>
          <select disabled class="mt-1 w-full border rounded-lg p-2 bg-gray-100">
            {% for employee in employees %}
              <option value="{{ employee.id }}" {% if employee.id == task.assigned_by %}selected{% endif %}>
                {{ employee.employee_name }}
              </option>
            {% endfor %}
          </select>
          <input type="hidden" name="assigned_by" value="{{ task.assigned_by }}">
        </div>
      </div>

      <!-- Dates -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div>
          <label class="block text-sm font-medium text-gray-600">Start Date <span class="text-red-500">*</span></label>
          <input id="start_date" name="start_date" type="date" value="{{ task.Start_Date or '' }}"
            class="mt-1 w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500">
          <p class="text-red-500 text-sm mt-1" id="start_date_error"></p>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-600">End Date <span class="text-red-500">*</span></label>
          <input id="end_date" name="end_date" type="date" value="{{ task.End_Date or '' }}"
            class="mt-1 w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500">
          <p class="text-red-500 text-sm mt-1" id="end_date_error"></p>
        </div>
      </div>

      <!-- Comments -->
      <div>
        <label class="block text-sm font-medium text-gray-600">Manager Comments</label>
        <textarea id="comments" name="comments" rows="2"
          class="mt-1 w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500">{{ task.Comments or '' }}</textarea>
      </div>

      <!-- Status and Attachment -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div>
          <label class="block text-sm font-medium text-gray-600">Status <span class="text-red-500">*</span></label>
          <select id="status" name="status"
            class="mt-1 w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500">
            <option value="">-- Select Status --</option>
            <option value="PENDING" {% if task.status == 'PENDING' %}selected{% endif %}>Pending</option>
            <option value="COMPLETED" {% if task.status == 'COMPLETED' %}selected{% endif %}>Completed</option>
          </select>
          <p class="text-red-500 text-sm mt-1" id="status_error"></p>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-600">Attachment</label>
          <input id="attachment" name="attachment" type="file"
            class="mt-1 w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500"
            accept=".pdf,.doc,.docx,.txt,.png,.jpg,.jpeg,.gif">
        </div>
      </div>

      <!-- Buttons -->
      <div class="flex justify-between items-center pt-6">
        <a href="{{ url_for('task_bp.list_tasks', project_id=task.project_id) }}"
          class="bg-blue-600 text-white py-2 px-4 rounded-lg shadow hover:bg-blue-700 transition">
          <i class="fas fa-arrow-left"></i> Back to Task List
        </a>

        <button type="submit"
          class="bg-blue-600 text-white py-2 px-4 rounded-lg shadow hover:bg-blue-700 transition">
          <i class="fas fa-save"></i> Update Task
        </button>
      </div>

    </form>
  </div>
</main>

<!-- JS Validation -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
$(document).ready(function() {
  $("#editTaskForm").submit(function(e) {
    let valid = true;
    $("p.text-red-500").text("");
    $("input, select").removeClass("border-red-500");

    function showError(id, msg) {
      $("#" + id).addClass("border-red-500");
      $("#" + id + "_error").text(msg);
      valid = false;
    }

    // Required fields validation
    const requiredFields = [
      ["task_name", "Task Name is required."],
      ["task_duration", "Duration is required."],
      ["estimated_hrs", "Estimated Hours is required."],
      ["assigned_to", "Assign To is required."],
      ["start_date", "Start Date is required."],
      ["end_date", "End Date is required."],
      ["status", "Status is required."]
    ];

    requiredFields.forEach(([id, msg]) => {
      if (!$("#" + id).val()) showError(id, msg);
    });

    // Date validation
    const start = new Date($("#start_date").val());
    const end = new Date($("#end_date").val());
    if ($("#end_date").val() && end < start) showError("end_date", "End Date cannot be before Start Date.");

    // Hours validation
    const dur = parseFloat($("#task_duration").val()) || 0;
    const est = parseFloat($("#estimated_hrs").val()) || 0;
    const worked = parseFloat($("#worked_hrs").val()) || 0;
    const max = dur * 24;

    if (est < worked) {
      showError("estimated_hrs", "Estimated Hours cannot be less than Worked Hours.");
      showError("worked_hrs", "Worked Hours cannot exceed Estimated Hours.");
    }
    if (est > max) showError("estimated_hrs", `Estimated Hours cannot exceed total (${max}).`);
    if (worked > max) showError("worked_hrs", `Worked Hours cannot exceed total (${max}).`);

    if (!valid) e.preventDefault();
  });
});
</script>
{% endblock %}
