<aside class="w-64 min-h-screen bg-white/90 shadow-2xl flex flex-col fixed top-0 left-0 bottom-0 border-r border-indigo-100 z-20 backdrop-blur-xl">

  <!-- Sidebar Header -->
  <div class="p-6 flex items-center gap-3 text-2xl font-extrabold text-indigo-700 bg-gradient-to-r from-indigo-50 via-white to-blue-50 rounded-t-2xl shadow-sm select-none">
    <i class="fa fa-user-circle text-indigo-400"></i>
    <span class="tracking-wide">Employee Dashboard</span>
  </div>

  <!-- Navigation Container -->
  <nav class="flex-1 px-5 py-6 mt-4 space-y-3 text-indigo-700 font-semibold">

    <!-- Home -->
    <a href="/employee" class="flex items-center gap-4 px-4 py-3 rounded-xl hover:bg-indigo-100 transition duration-150 shadow focus:outline-none focus:ring-2 focus:ring-indigo-300 group">
      <i class="fa fa-home text-xl text-indigo-600 group-hover:text-indigo-800"></i>
      <span>Home</span>
    </a>

    <!-- Tickets -->
    <a href="/test" class="flex items-center gap-4 px-4 py-3 rounded-xl hover:bg-indigo-100 transition duration-150 shadow focus:outline-none focus:ring-2 focus:ring-indigo-300 group">
      <i class="fa fa-ticket-alt text-xl text-indigo-600 group-hover:text-indigo-800"></i>
      <span>Tickets</span>
    </a>

    <!-- Comments Dropdown -->
    <div x-data="{ open: false }" class="relative">
      <button @click="open = !open" class="flex items-center justify-between w-full px-4 py-3 rounded-xl text-indigo-700 hover:bg-indigo-100 transition shadow focus:outline-none focus:ring-2 focus:ring-indigo-300">
        <span class="flex items-center gap-3">
          <i class="fa fa-comments text-indigo-600"></i>
          <span>Comments</span>
        </span>
        <i :class="open ? 'fa fa-chevron-up' : 'fa fa-chevron-down'" class="w-4"></i>
      </button>
      <div x-show="open" x-transition class="mt-2 ml-6 flex flex-col space-y-1 text-indigo-600 text-sm font-normal">
        <a href="/create_task_comment" class="flex items-center px-4 py-2 rounded-lg hover:bg-indigo-100 transition focus:outline-none">
          <i class="fa fa-tasks w-4 mr-2"></i>
          <span>Tasks</span>
        </a>
        <a href="/create_support_comment" class="flex items-center px-4 py-2 rounded-lg hover:bg-indigo-100 transition focus:outline-none">
          <i class="fa fa-ticket-alt w-4 mr-2"></i>
          <span>Support Ticket</span>
        </a>
      </div>
    </div>

    <!-- Task Updation -->
    <a href="task_update" class="flex items-center gap-4 px-4 py-3 rounded-xl hover:bg-indigo-100 transition duration-150 shadow focus:outline-none focus:ring-2 focus:ring-indigo-300 group">
      <i class="fa fa-ticket text-xl text-indigo-600 group-hover:text-indigo-800"></i>
      <span>Task Updation</span>
    </a>

    <!-- Open Tickets -->
    <a href="{{ url_for('open_tickets') }}" class="flex items-center gap-4 px-4 py-3 rounded-xl hover:bg-indigo-100 transition duration-150 shadow focus:outline-none focus:ring-2 focus:ring-indigo-300 group">
      <i class="fa fa-file-alt text-xl text-indigo-600 group-hover:text-indigo-800"></i>
      <span>Open Tickets</span>
    </a>

  </nav>

  <!-- Logout Button (Outside Nav, Pinned to Bottom) -->
  <div class="px-5 pb-8">
    <a href="/logout" class="flex items-center gap-4 px-4 py-3 w-full rounded-xl font-bold text-red-700 bg-red-50 hover:bg-red-200 transition duration-150 shadow focus:outline-none focus:ring-2 focus:ring-red-300 group">
      <i class="fa fa-sign-out-alt text-xl group-hover:text-red-900"></i>
      <span>Logout</span>
    </a>
  </div>

</aside>

<!-- Alpine.js for dropdown functionality -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.12.0/cdn.min.js" defer></script>
