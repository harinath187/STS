

<!-- Navbar -->
<div class="flex items-center justify-between mb-0 bg-gray-100 p-4">
  <div class="flex items-center space-x-4">
    <!-- Avatar -->
    <div id="avatarButton" class="w-10 h-10 rounded-full bg-blue-500 flex items-center justify-center text-white font-semibold cursor-pointer">
      {{ user.firstname.split(' ')[0][0] }}{{ user.lastname.split(' ')[-1][0] }}
    </div>
  </div>
</div>
 
<!-- Profile Modal -->
<div id="profileModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
  <div class="bg-white p-6 rounded-lg max-w-md w-full relative shadow-lg">
    <button id="closeModal" class="absolute top-2 right-2 text-gray-600 hover:text-gray-800 text-2xl font-bold">&times;</button>
    <h2 class="text-2xl font-bold mb-4">Employee Profile</h2>
    <form id="profileForm" class="space-y-2">
      <input type="hidden" id="empId" />
      <div>
        <label>ID:</label>
        <span id="empIdDisplay"></span>
      </div>
      <div>
        <label>First Name:</label>
        <input type="text" id="firstname" class="border px-2 py-1 w-full" readonly />
      </div>
      <div>
        <label>Last Name:</label>
        <input type="text" id="lastname" class="border px-2 py-1 w-full" readonly />
      </div>
      <div>
        <label>Username:</label>
        <input type="text" id="username" class="border px-2 py-1 w-full" />
      </div>
      <div>
        <label>Email:</label>
        <input type="email" id="email" class="border px-2 py-1 w-full" />
      </div>
      <div>
        <label>Password:</label>
        <input type="text" id="password" class="border px-2 py-1 w-full" />
      </div>
      <div>
        <label>Department:</label>
        <input type="text" id="dept_name" class="border px-2 py-1 w-full" readonly />
      </div>
      <div>
        <label>Role ID:</label>
        <input type="text" id="role_id" class="border px-2 py-1 w-full" readonly />
      </div>
      <div class="flex justify-end space-x-2 mt-2">
        <button type="button" id="updateProfile" class="bg-blue-500 text-white px-4 py-1 rounded">Update</button>
      </div>
    </form>
  </div>
</div>
 
<!-- Profile Modal JavaScript -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    const avatarButton = document.getElementById('avatarButton');
    const profileModal = document.getElementById('profileModal');
    const closeModal = document.getElementById('closeModal');
 
    const empId = document.getElementById('empId');
    const empIdDisplay = document.getElementById('empIdDisplay');
    const firstname = document.getElementById('firstname');
    const lastname = document.getElementById('lastname');
    const username = document.getElementById('username');
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const dept_name = document.getElementById('dept_name');
    const role_id = document.getElementById('role_id');
    const updateProfileBtn = document.getElementById('updateProfile');
 
    // Open modal and load profile
    avatarButton.addEventListener('click', function() {
        fetch('/profile_data')
            .then(response => response.json())
            .then(data => {
                if(data.error){
                    alert(data.error);
                    return;
                }
 
                empId.value = data.id;
                empIdDisplay.innerText = data.id;
                firstname.value = data.firstname;
                lastname.value = data.lastname || '';
                username.value = data.username;
                email.value = data.email;
                password.value = data.password; // shows actual password
                dept_name.value = data.dept_name || '';
                role_id.value = data.role_id;
 
                profileModal.classList.remove('hidden');
            })
            .catch(error => console.error('Error fetching profile:', error));
    });
 
    // Close modal button
    closeModal.addEventListener('click', function() {
        profileModal.classList.add('hidden');
    });
 
    // Close modal when clicking outside
    profileModal.addEventListener('click', function(e) {
        if(e.target === profileModal) {
            profileModal.classList.add('hidden');
        }
    });
 
    // Password validation: at least 2 numbers and 2 special characters (@, #)
    function validatePassword(pwd){
        const numMatch = pwd.match(/\d/g) || [];
        const specialMatch = pwd.match(/[@#]/g) || [];
        return numMatch.length >= 2 && specialMatch.length >= 2;
    }
 
    // Update profile
    updateProfileBtn.addEventListener('click', function() {
        const updatedData = {
            id: empId.value,
            username: username.value,
            email: email.value,
            password: password.value
        };
 
        if(!validatePassword(updatedData.password)){
            alert('Password must contain at least 2 numbers and 2 special characters (@ or #)');
            return;
        }
 
        fetch('/update_profile', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(updatedData)
        })
        .then(response => response.json())
        .then(data => {
            if(data.success){
                alert('Profile updated successfully!');
                profileModal.classList.add('hidden');
            } else {
                alert('Error: ' + data.error);
            }
        })
        .catch(error => console.error('Error updating profile:', error));
    });
});
</script>
