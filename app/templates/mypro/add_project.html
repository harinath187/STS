{% extends "base.html" %}
{% block title %}Add Project{% endblock %}

{% block content %}
<script src="https://cdn.tailwindcss.com"></script>

<!-- Sidebar -->
<aside class="w-64 bg-white shadow-md flex flex-col fixed top-0 left-0 bottom-0">
  {% include "common/project_manager.html" %}
</aside>

<!-- Main content -->
<main class="flex-1 ml-64 p-10">
  <div class="bg-white shadow-lg rounded-2xl w-full max-w-2xl p-8 mx-auto">
    <h2 class="text-2xl font-bold mb-6 text-gray-700">Project Management Form</h2>

    <form method="POST" action="/save_project" id="projectForm" class="space-y-5" enctype="multipart/form-data" novalidate>
      
      <!-- Project Name -->
      <div>
        <label class="block text-sm font-medium text-gray-600">Project Name</label>
        <input name="project_name" type="text" placeholder="Enter project name"
          class="mt-1 w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500">
      </div>

      <!-- Client Name Dropdown -->
      <div>
        <label class="block text-sm font-medium text-gray-600">Client Name</label>
        <select name="client_name" class="mt-1 w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500">
          <option value="">-- Select Client --</option>
          {% for name in client_name %}
            <option value="{{name[0]}}">{{ name[2] }}</option>
          {% endfor %}
        </select>
      </div>

      <!-- Estimated Duration -->
      <div>
        <label class="block text-sm font-medium text-gray-600">Estimated Duration (days)</label>
        <input name="estimated_duration" type="number" placeholder="e.g. 60"
          class="mt-1 w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500">
      </div>

      <!-- Tech Stack -->
      <div>
        <label class="block text-sm font-medium text-gray-600">Tech Stack</label>
        <input name="tech_stack" type="text" placeholder="e.g. React, Flask, MySQL"
          class="mt-1 w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500">
        <p class="text-sm text-gray-500 mt-1" id="techStackCount">0 / 100</p>
      </div>

      <!-- Time Taken -->
      <div>
        <label class="block text-sm font-medium text-gray-600">Time Taken (days)</label>
        <input name="time_taken" type="number" placeholder="e.g. 45"
          class="mt-1 w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500">
      </div>

      <!-- Cost Hours -->
      <div>
        <label class="block text-sm font-medium text-gray-600">Cost Hours</label>
        <input name="cost_hours" type="number" placeholder="e.g. 1200"
          class="mt-1 w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500">
      </div>

      

      <!-- Status Percentage -->
      <div>
        <label class="block text-sm font-medium text-gray-600">Status (%)</label>
        <input id="statusRange" name="status_percentage" type="range" min="0" max="100" value="50" class="w-full">
        <div class="text-right text-sm text-gray-500">
          <span id="statusValue">50</span>%
        </div>
      </div>

      <!-- Submit Button -->
      <div class="pt-4">
        <button type="submit"
          class="w-full bg-blue-600 text-white py-2 px-4 rounded-xl shadow hover:bg-blue-700 transition">
          Save Project
        </button>
      </div>

    </form>
  </div>

  <!-- jQuery & Validation -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>

  <script>
  $(document).ready(function() {
    // Live status update
    $("#statusRange").on("input", function() {
      $("#statusValue").text($(this).val());
      $(this).valid();
    });

    // Tech stack character count
    $('input[name="tech_stack"]').on('input', function() {
      $('#techStackCount').text(`${$(this).val().length} / 100`);
    });

    // Prevent negative numbers
    $('input[type=number]').on('input', function() {
      if ($(this).val() < 0) $(this).val('');
    });

    // Trigger validation on select and file change
    $('select, input[type="file"]').on('change', function() {
      $(this).valid();
    });

    // Validation setup
    $("#projectForm").validate({
      rules: {
        project_name: "required",
        client_name: "required",
        estimated_duration: {
          required: true,
          number: true,
          min: 1
        },
        tech_stack: {
          required: true,
          maxlength: 100
        },
        time_taken: {
          required: true,
          number: true,
          min: 0
        },
        cost_hours: {
          required: true,
          number: true,
          min: 0
        },
        
        status_percentage: {
          required: true,
          range: [0, 100]
        }
      },
      messages: {
        project_name: "Please enter project name",
        client_name: "Please select a client",
        estimated_duration: "Enter a valid duration (≥1)",
        tech_stack: "Enter tech stack (max 100 characters)",
        time_taken: "Enter valid time taken (≥0)",
        cost_hours: "Enter valid cost hours (≥0)",
        attachments: "Only PDF, DOC, JPG, or PNG files allowed",
        status_percentage: "Status must be between 0 and 100"
      },
      errorElement: 'p',
      errorClass: 'text-red-500 text-sm mt-1',
      highlight: function(element) {
        $(element).addClass('border-red-500').removeClass('border-green-500');
      },
      unhighlight: function(element) {
        $(element).removeClass('border-red-500').addClass('border-green-500');
      },
      success: function(label, element) {
        $(element).removeClass('border-red-500').addClass('border-green-500');
      },
      errorPlacement: function(error, element) {
        error.insertAfter(element);
      },
      submitHandler: function(form) {
        let formData = new FormData(form);
        $.ajax({
          url: "/save_project",
          type: "POST",
          data: formData,
          processData: false,
          contentType: false,
          success: function(response) {
            alert("Project saved successfully!");
            form.reset();
            $("#statusValue").text("50");
            $(".border-green-500").removeClass("border-green-500");
          },
          error: function(err) {
            alert("Error saving project.");
            console.error(err);
          }
        });
        
      }
    });
  
    // File change alert
    $('input[name="attachments"]').on('change', function() {
      if (this.files.length > 0) {
        alert("Selected file: " + this.files[0].name);
      }
    });
  });
  </script>
</main>
{% endblock %}
